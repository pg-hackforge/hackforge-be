spring.application.name=hackforge
server.address=127.0.0.1
server.port=8080

# schema는 Flyway(db/migration)만 바꾼다. entity와 어긋나면 기동 실패
spring.jpa.hibernate.ddl-auto=validate
spring.session.jdbc.initialize-schema=never
# 로그인 세션 idle 만료
server.servlet.session.timeout=30m
# 세션 cookie(SESSION). 운영은 Secure도 켠다(SERVER_SERVLET_SESSION_COOKIE_SECURE=true)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 로그인은 AuthController가 직접 처리한다. 기본 생성 계정(user/랜덤 비밀번호)을 만들지 않음
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
# Swagger UI(bootRun 전용). 화면은 코드에서 만든 spec(/v3/api-docs)이 아니라 openapi.yaml(/openapi.yaml)을 보여 준다.
# api-docs.enabled=false로 끄면 Swagger UI도 같이 꺼짐
springdoc.swagger-ui.url=/openapi.yaml
# Try it out 요청에 XSRF-TOKEN cookie 값을 X-XSRF-TOKEN header로 넣음
springdoc.swagger-ui.csrf.enabled=true
# 실습 Pod 자원(ADR 013). requests와 limits에 같은 값. 개발 VM 값이고 운영 값은 운영 서버에서 정함
hackforge.lab.cpu=500m
hackforge.lab.memory=512Mi
hackforge.lab.disk=2Gi
# 동시 진행 세션 수 상한(ADR 012). 개발 VM 값이고 운영은 5
hackforge.lab.max-concurrent=2
# CREATING, INITIALIZING에 머물 수 있는 시간. 넘으면 재시도 1회 후 실패(ADR 012). 운영 서버 측정 후 다시 정함
hackforge.lab.start-timeout=5m
# reconciler가 진행 중 세션을 확인하는 간격. 테스트에서는 build.gradle에서 reconciler를 끈다
hackforge.lab.reconcile-interval=3s
# READY에서 마지막 활동 뒤 이 시간이 지나면 IDLE로 종료. 경고는 종료 idle-warning 전부터(ADR 012)
hackforge.lab.idle-timeout=30m
hackforge.lab.idle-warning=5m
# 진행 중 세션이 없는 lab namespace를 지우는 간격(ADR 012)
hackforge.lab.orphan-cleanup-interval=5m
# 클러스터 접속용 kubeconfig 경로. 비우면 in-cluster 설정(운영). 개발 PC는 환경 변수 HACKFORGE_LAB_KUBECONFIG로 지정
hackforge.lab.kubeconfig=
