name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # API 계약 문법 검사. 버전을 고정해 새 규칙이 갑자기 PR을 막지 않게 한다
      - run: npx --yes @redocly/cli@2.65.0 lint openapi.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
