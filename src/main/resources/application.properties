spring.application.name=hackforge
server.address=127.0.0.1
server.port=8080

# schema는 Flyway(db/migration)만 바꾼다. entity와 어긋나면 기동 실패
spring.jpa.hibernate.ddl-auto=validate
spring.session.jdbc.initialize-schema=never
# 로그인 세션 idle 만료
server.servlet.session.timeout=30m
# 세션 cookie(SESSION). 운영은 Secure도 켠다(SERVER_SERVLET_SESSION_COOKIE_SECURE=true)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 로그인은 AuthController가 직접 처리한다. 기본 생성 계정(user/랜덤 비밀번호)을 만들지 않음
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
# Swagger UI(bootRun 전용). 화면은 코드에서 만든 spec(/v3/api-docs)이 아니라 openapi.yaml(/openapi.yaml)을 보여 준다.
# api-docs.enabled=false로 끄면 Swagger UI도 같이 꺼짐
springdoc.swagger-ui.url=/openapi.yaml
# Try it out 요청에 XSRF-TOKEN cookie 값을 X-XSRF-TOKEN header로 넣음
springdoc.swagger-ui.csrf.enabled=true
