openapi: 3.1.0
info:
  title: Hackforge API
  version: 0.1.0
  description: >-
    hackforge-be와 hackforge-fe 사이의 계약.
    API를 바꿀 때는 구현보다 이 파일을 먼저 PR로 올려 합의한다.


    인증: 로그인하면 서버가 세션 쿠키(`SESSION`, HttpOnly, SameSite=Lax)를 준다.
    요청이 없으면 30분 뒤 만료된다.


    CSRF: 서버는 응답에 `XSRF-TOKEN` 쿠키(JS에서 읽을 수 있음)를 준다.
    GET이 아닌 요청은 그 값을 `X-XSRF-TOKEN` 헤더에 넣어 보낸다. 없거나 틀리면 403.
    로그인 전에도 필요하므로, 클라이언트는 먼저 아무 GET 요청(예: `GET /api/me`)으로 쿠키를 받는다.


    오류: 모든 오류 응답은 RFC 9457 Problem Details(`application/problem+json`)이고,
    클라이언트가 분기할 수 있도록 `code`를 함께 준다.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: auth
    description: 가입, 로그인, 내 계정
  - name: admin
    description: 관리자 전용. 로그인하지 않으면 401, 관리자가 아니면 403
security:
  - sessionCookie: []
    csrfHeader: []
paths:
  /api/auth/signup:
    post:
      tags: [auth]
      summary: 자가 가입
      description: >-
        계정은 승인 대기(`PENDING`), 역할 학습자(`LEARNER`)로 만들어진다.
        가입만 하고 로그인은 하지 않는다. 이메일은 소문자로 저장한다.
      operationId: signup
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          description: >-
            이미 가입된 이메일(`EMAIL_TAKEN`) 또는 닉네임(`NICKNAME_TAKEN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: >-
        성공하면 세션 쿠키를 새로 발급한다(세션 고정 방지).
        같은 계정으로 5번 연속 실패하면 15분 잠근다. 잠긴 동안은 비밀번호를 확인하지 않는다.
        승인 대기·거절 계정도 로그인할 수 있다.
      operationId: login
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            이메일이나 비밀번호가 틀림(`INVALID_CREDENTIALS`). 어느 쪽이 틀렸는지 구분하지 않는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          description: 잠긴 계정(`ACCOUNT_LOCKED`)
          headers:
            Retry-After:
              description: 잠금이 풀릴 때까지 남은 초
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      description: 지금 세션만 지운다. 로그인하지 않은 상태로 불러도 204
      operationId: logout
      security:
        - csrfHeader: []
      responses:
        '204':
          description: 로그아웃됨
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/me:
    get:
      tags: [auth]
      summary: 내 계정
      description: >-
        화면은 `status`를 보고 승인 대기·거절을 안내한다.
        승인 상태는 세션이 아니라 DB에서 매번 읽는다.
      operationId: getMe
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 내 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/me/password:
    put:
      tags: [auth]
      summary: 내 비밀번호 변경
      description: 성공하면 지금 세션을 뺀 내 다른 세션을 모두 지운다
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 변경됨
        '400':
          description: >-
            입력 규칙 위반(`VALIDATION_FAILED`) 또는 현재 비밀번호가 틀림(`CURRENT_PASSWORD_MISMATCH`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/admin/users:
    get:
      tags: [admin]
      summary: 계정 목록
      description: 가입 순서(오래된 것부터). v1 규모(수십 명)라 페이지 나눔은 없다
      operationId: listUsers
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: 생략하면 `PENDING`
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: 계정 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/users/{id}/approve:
    post:
      tags: [admin]
      summary: 가입 승인
      description: '`PENDING` 또는 `REJECTED`에서만 `APPROVED`로 바꾼다'
      operationId: approveUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 승인됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/InvalidStatusTransition'
  /api/admin/users/{id}/reject:
    post:
      tags: [admin]
      summary: 가입 거절
      description: '`PENDING`에서만 `REJECTED`로 바꾼다. 승인된 계정은 거절할 수 없다(계정 정지는 v1 범위 밖)'
      operationId: rejectUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 거절됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/InvalidStatusTransition'
  /api/admin/users/{id}/role:
    put:
      tags: [admin]
      summary: 역할 변경
      description: >-
        대상 계정의 로그인 세션을 모두 지운다. 다시 로그인하면 새 역할이 적용된다.
        자기 자신의 역할은 바꿀 수 없다(관리자가 0명이 되는 것을 막음)
      operationId: changeUserRole
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 관리자가 아님(`FORBIDDEN`), 자기 역할 변경(`CANNOT_CHANGE_OWN_ROLE`), CSRF 거절(`CSRF_REJECTED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/UserNotFound'
  /api/admin/users/{id}/temporary-password:
    post:
      tags: [admin]
      summary: 임시 비밀번호 발급
      description: >-
        비밀번호 규칙을 만족하는 무작위 비밀번호로 바꾸고, 응답으로 한 번만 돌려준다(저장하지 않음).
        대상 계정의 로그인 세션을 모두 지우고 잠금을 푼다
      operationId: issueTemporaryPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: '발급됨. 응답은 캐시하지 않는다(`Cache-Control: no-store`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporaryPassword'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UserNotFound'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: '`XSRF-TOKEN` 쿠키 값을 그대로 넣는다'
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    ValidationFailed:
      description: 입력 규칙 위반(`VALIDATION_FAILED`). 항목별 이유는 `errors`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: 로그인하지 않음(`UNAUTHENTICATED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 관리자가 아님(`FORBIDDEN`) 또는 CSRF 거절(`CSRF_REJECTED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfRejected:
      description: CSRF 토큰이 없거나 틀림(`CSRF_REJECTED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UserNotFound:
      description: 없는 계정(`USER_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidStatusTransition:
      description: 지금 상태에서 할 수 없는 승인·거절(`INVALID_STATUS_TRANSITION`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      description: 8~64자, 영문·숫자·특수문자를 각각 하나 이상
      minLength: 8
      maxLength: 64
      pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,64}$'
    UserRole:
      type: string
      enum: [LEARNER, AUTHOR, ADMIN]
    UserStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    SignupRequest:
      type: object
      required: [email, password, name, nickname, affiliation, privacyAgreed]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          type: string
          minLength: 1
          maxLength: 50
        nickname:
          type: string
          description: 2~20자, 한글·영문·숫자·`_`. 유일
          pattern: '^[가-힣A-Za-z0-9_]{2,20}$'
        affiliation:
          type: string
          description: 학교·학과·회사 등 자유 입력
          minLength: 1
          maxLength: 100
        signupNote:
          type: string
          description: 관리자가 본인을 확인하는 데 쓰는 메모(선택)
          maxLength: 200
        privacyAgreed:
          type: boolean
          description: 개인정보 수집·이용 동의. `true`만 받는다
          const: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 64
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 64
        newPassword:
          $ref: '#/components/schemas/Password'
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
    Me:
      type: object
      required: [id, email, name, nickname, affiliation, role, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        nickname:
          type: string
        affiliation:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
    AdminUser:
      description: 관리자가 승인할 때 보는 정보. `Me`에 가입 메모를 더한다
      allOf:
        - $ref: '#/components/schemas/Me'
        - type: object
          properties:
            signupNote:
              type: [string, 'null']
    TemporaryPassword:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
    Problem:
      description: RFC 9457 Problem Details
      type: object
      required: [status, title, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: 클라이언트가 분기할 때 쓰는 오류 코드
          enum:
            - VALIDATION_FAILED
            - EMAIL_TAKEN
            - NICKNAME_TAKEN
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - CURRENT_PASSWORD_MISMATCH
            - UNAUTHENTICATED
            - FORBIDDEN
            - CSRF_REJECTED
            - CANNOT_CHANGE_OWN_ROLE
            - USER_NOT_FOUND
            - INVALID_STATUS_TRANSITION
        errors:
          description: '`VALIDATION_FAILED`일 때 항목별 이유'
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
