plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.popogonry'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	mockitoAgent
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	// bootRun에서만 Swagger UI(/swagger-ui.html). bootJar(운영)에는 들어가지 않음
	developmentOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'io.kubernetes:client-java:27.0.1'
	mockitoAgent('org.mockito:mockito-core') { transitive = false }
	constraints {
		// client-java 27.0.1이 끌어오는 버전에 알려진 취약점이 있어 올림(OSV, 2026-11-12). client-java를 올릴 때 다시 확인
		implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
		implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
		implementation 'org.bouncycastle:bcutil-jdk18on:1.86'
		implementation 'com.google.guava:guava:33.7.2-jre'
	}
}

// Swagger UI가 보여 줄 spec. 코드에서 만들지 않고 openapi.yaml을 그대로 쓴다
tasks.named('processResources') {
	from('openapi.yaml') { into 'static' }
}

// 개발 DB에만 테스트 문제를 넣는다(db/dev/R__dev_challenges.sql). 테스트와 운영 jar는 db/migration만 적용
tasks.named('bootRun') {
	systemProperty 'spring.flyway.locations', 'classpath:db/migration,classpath:db/dev'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'cluster'
	}
	// 다른 테스트가 만든 세션을 reconciler가 처리하지 않게 끈다. reconciler 테스트는 직접 호출함
	systemProperty 'hackforge.lab.reconciler.enabled', 'false'
	// Mockito가 실행 중에 agent를 붙이면 JDK가 경고하고, 이후 JDK에서는 막힘
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

// 실제 클러스터를 호출하는 테스트(@Tag("cluster")). 환경 변수 HACKFORGE_LAB_KUBECONFIG에 백엔드 kubeconfig 경로 필요
tasks.register('clusterTest', Test) {
	description = 'Runs tests against the dev cluster.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'cluster'
	}
}
